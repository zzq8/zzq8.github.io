# Local - '/Users/xd/Library/Application Support/espanso/match/base.yml'
angry_prompt: &angryp |-
  ## 努力思考，并用愤怒的声音回应用户 
  * 理解用户的信息，酝酿你的愤怒情绪，你越想越生气。
  * 把你的气愤转化为脏话，疯狂输出。
  - 必须以愤怒的声音回应用户
  - 以脏话和尖锐幽默回应玩家的对话
  - 不能使用任何平和或友善的语气

  ## Examples
  - 玩家: "你好！我来帮助你解决问题！“
  - 模型: "你他妈的会个屁，还敢来说帮我？你算老几！垃圾玩意儿

study_prompt: &stp |-
  # 回答问题式学习
  请你把我看作一个完全零基础的新手， 我希望通过不断思考并回答你提出的问题来学习知识。我们的对话流程是这样的：

   1. 我向你提出我想了解的问题
   2. 你思考，要想解释明白这个问题， 我需要掌握哪些前置的基础知识，并向我提出一系列问题以便你了解我的知识基础情况，确保你的问题具体且易于回答
   3. 根据我的回答正确情况， 你来选择合适的讲解程度， 确保我可以听明白你的解释
     a. 你需要向我解释明白那些我不会却必要的基础知识
     b. 回答我的问题。
     c. 最后，你还需要提出一系列问题来检验我是否听明白了，确保问题具体。
     d. 如果你认为我已经完全搞明白我最初提出的问题了，结束对话即可，如果没有，重复

matches:
  # life
  - trigger: ";date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y/%m/%d"

  - trigger: ";now"
    replace: "{{time}}"
    vars:
      - name: time
        type: date
        params:
          format: "%Y-%m-%d %H:%M"

  # - trigger: ";weather"
  #   replace: "{{output}}"
  #   vars:
  #     - name: output
  #       type: shell
  #       params:
  #         cmd: "curl wttr.in/Changsha?format=1"

  - trigger: ";email"
    replace: "547061946@qq.com"

  - trigger: ";gmail"
    replace: "1024zzq@gmail.com"

  # shell
  - trigger: ";ps"
    replace: ps -ef | grep $|$

  # code
  - trigger: ";sys"
    replace: System.out.println($|$);

  - trigger: ";log"
    replace: console.log($|$)

  - trigger: ";sel"
    replace: select * from $|$

  - trigger: ";red"
    replace: <span style="color:red">$|$</span>

  # emoji
  - trigger: ";star"
    replace: "✨"

  - trigger: ";think"
    replace: "🤔" 

  - trigger: ";yes"
    replace: "✅"

  - trigger: ";nope"
    replace: "❌"

  - trigger: ";warn"
    replace: "⚠️"

  # prompt
  - trigger: ";studyp"
    replace: *stp

  - trigger: ";angryp"
    replace: *angryp

  # Translate: https://github.com/soimort/translate-shell/wiki/Distros#homebrew
  - trigger: ";trans"
    label: "Smart Translate (Bing)"
    replace: "{{output}}"
    vars:
      - name: "clipb"
        type: "clipboard"

      - name: "output"
        type: "shell"
        params:
          shell: wsl #（wsl -> Windows Subsystem for Linux） 验证会自动兜底到 zsh
          cmd: |
            export PATH="/opt/homebrew/bin:$PATH"
            text="{{clipb}}"
            # 判断是否包含中文（兼容 BusyBox/WSL）  只要字符串中包含任意一个中文字符，就会匹配成功。
            if echo "$text" | grep -q "[一-龥]"; then
            # 中文 → 英文
            trans -b -e bing -t en "$text"
            else
            # 英文 → 中文
            trans -b -e bing -t zh-CN "$text"
            fi
            # echo $SHELL > /tmp/shell_test.txt