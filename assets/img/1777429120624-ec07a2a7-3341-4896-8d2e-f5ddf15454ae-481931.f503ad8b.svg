<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 550" width="1050" height="550">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title-main { font-size: 24px; font-weight: bold; fill: #2D3748; }
      .step-title { font-size: 16px; font-weight: bold; fill: #2D3748; }
      .step-desc { font-size: 13px; fill: #64748B; }
      .box-tag { font-size: 12px; font-weight: bold; fill: #FFFFFF; }
      .arrow-label { font-size: 13px; font-weight: bold; fill: #E99151; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#005D7B" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1050" height="550" fill="#F8FAFC"/>
  <rect width="1050" height="550" fill="url(#grid)"/>

  <text x="40" y="50" class="title-main">Spring AI Progressive Disclosure：渐进式揭示加载机制</text>
  
  <g transform="translate(850, 510) rotate(-5)">
    <text x="0" y="0" font-size="14" fill="#94A3B8">公众号：<tspan fill="#005D7B" font-weight="bold">JavaGuide</tspan></text>
    <text x="0" y="20" font-size="14" fill="#94A3B8">网站：<tspan fill="#005D7B" font-weight="bold">javaguide.cn</tspan></text>
  </g>

  <g id="arrows">
    <line x1="300" y1="260" x2="390" y2="260" stroke="#E99151" stroke-width="2"/>
    <polygon points="390,260 382,255 382,265" fill="#E99151"/>
    <text x="345" y="250" class="arrow-label" text-anchor="middle">用户请求</text>

    <line x1="640" y1="260" x2="730" y2="260" stroke="#E99151" stroke-width="2"/>
    <polygon points="730,260 722,255 722,265" fill="#E99151"/>
    <text x="685" y="250" class="arrow-label" text-anchor="middle">Tool Call</text>
  </g>

  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="240" height="200" rx="12" fill="#FFFFFF" filter="url(#shadow)" stroke="#005D7B" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="40" rx="12" fill="#005D7B"/>
    <rect x="0" y="20" width="240" height="20" fill="#005D7B"/> <text x="20" y="26" class="box-tag">第一层：Discovery (发现)</text>
    
    <text x="20" y="70" class="step-title">SkillsTool 启动扫描</text>
    <text x="20" y="95" class="step-desc">解析 YAML 提取 name/desc</text>
    <text x="20" y="115" class="step-desc">构建轻量级 Tool 描述注册表</text>
    
    <rect x="20" y="140" width="200" height="40" rx="6" fill="#F1F5F9"/>
    <text x="120" y="165" class="step-desc" font-weight="bold" fill="#005D7B" text-anchor="middle">上下文开销：极小</text>
  </g>

  <g transform="translate(400, 160)">
    <rect x="0" y="0" width="240" height="200" rx="12" fill="#FFFFFF" filter="url(#shadow)" stroke="#4CA497" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="40" rx="12" fill="#4CA497"/>
    <rect x="0" y="20" width="240" height="20" fill="#4CA497"/>
    <text x="20" y="26" class="box-tag">第二层：Semantic Match</text>
    
    <text x="20" y="70" class="step-title">LLM 自主语义路由</text>
    <text x="20" y="95" class="step-desc">检查工具描述中的 Skill 列表</text>
    <text x="20" y="115" class="step-desc">判断用户意图与 desc 匹配度</text>
    
    <rect x="20" y="140" width="200" height="40" rx="6" fill="#F1F5F9"/>
    <text x="120" y="165" class="step-desc" font-weight="bold" fill="#4CA497" text-anchor="middle">上下文开销：几乎为零</text>
  </g>

  <g transform="translate(740, 160)">
    <rect x="0" y="0" width="240" height="200" rx="12" fill="#FFFFFF" filter="url(#shadow)" stroke="#E99151" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="40" rx="12" fill="#E99151"/>
    <rect x="0" y="20" width="240" height="20" fill="#E99151"/>
    <text x="20" y="26" class="box-tag">第三层：Execution (执行)</text>
    
    <text x="20" y="70" class="step-title">加载完整 SKILL.md</text>
    <text x="20" y="95" class="step-desc">命中后从磁盘读取完整指令</text>
    <text x="20" y="115" class="step-desc">将详细 Persona 注入上下文</text>
    
    <rect x="20" y="140" width="200" height="40" rx="6" fill="#FFF8F1"/>
    <text x="120" y="165" class="step-desc" font-weight="bold" fill="#C05621" text-anchor="middle">上下文开销：按需使用</text>
  </g>
</svg>
