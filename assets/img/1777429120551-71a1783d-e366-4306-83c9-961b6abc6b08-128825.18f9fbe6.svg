<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 650" width="1050" height="650">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title-main { font-size: 24px; font-weight: bold; fill: #2D3748; }
      .card-title { font-size: 16px; font-weight: bold; fill: #2D3748; }
      .card-desc { font-size: 13px; fill: #64748B; }
      .arrow-label { font-size: 12px; font-weight: bold; fill: #E99151; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#005D7B" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1050" height="650" fill="#F8FAFC"/>
  <rect width="1050" height="650" fill="url(#grid)"/>

  <text x="40" y="50" class="title-main">文字面试带简历场景：解决指令覆盖的并行双路出题架构</text>

  <g transform="translate(850, 610) rotate(-5)">
    <text x="0" y="0" font-size="14" fill="#94A3B8">公众号：<tspan fill="#005D7B" font-weight="bold">JavaGuide</tspan></text>
    <text x="0" y="20" font-size="14" fill="#94A3B8">网站：<tspan fill="#005D7B" font-weight="bold">javaguide.cn</tspan></text>
  </g>

  <g transform="translate(60, 270)">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="60" rx="3" fill="#2D3748"/>
    <text x="20" y="25" class="card-title">开始：带简历面试</text>
    <text x="20" y="45" class="card-desc">SkillId + ResumeText</text>
  </g>

  <g id="arrows-split">
    <path d="M 240 300 H 280 V 160 H 330" fill="none" stroke="#E99151" stroke-width="2"/>
    <polygon points="330,160 322,155 322,165" fill="#E99151"/>
    
    <path d="M 240 300 H 280 V 440 H 330" fill="none" stroke="#005D7B" stroke-width="2"/>
    <polygon points="330,440 322,435 322,445" fill="#005D7B"/>

    <text x="235" y="250" class="arrow-label" font-size="11" fill="#64748B">Virtual Thread 并行调度</text>
  </g>

  <rect x="340" y="100" width="360" height="150" rx="12" fill="#FFF8F1" stroke="#E99151" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="355" y="125" class="card-title" fill="#C05621">Path A: 简历深挖题 (60%)</text>
  <g transform="translate(360, 140)">
    <rect x="0" y="0" width="320" height="90" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#E99151"/>
    <text x="20" y="25" class="card-title">PlainChatClient</text>
    <text x="20" y="45" class="card-desc">禁用 SkillsTool 物理隔离工具调用</text>
    <text x="20" y="65" class="card-desc">独立 Prompt：interview-resume-system.st</text>
    <text x="20" y="85" class="card-desc">指令约束：严禁编造不存在的项目</text>
  </g>

  <rect x="340" y="380" width="360" height="150" rx="12" fill="#F0F9FF" stroke="#005D7B" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="355" y="405" class="card-title" fill="#005D7B">Path B: 方向基础题 (40%)</text>
  <g transform="translate(360, 420)">
    <rect x="0" y="0" width="320" height="90" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="90" rx="3" fill="#005D7B"/>
    <text x="20" y="25" class="card-title">ChatClient + SkillsTool</text>
    <text x="20" y="45" class="card-desc">LLM 首轮主动调用 Skill 获取 Persona</text>
    <text x="20" y="65" class="card-desc">独立 Prompt：interview-skill-system.st</text>
    <text x="20" y="85" class="card-desc">指令约束：避开简历内容纯考查基础</text>
  </g>

  <g id="arrows-merge">
    <path d="M 700 160 H 750 V 290 H 800" fill="none" stroke="#E99151" stroke-width="2"/>
    <polygon points="800,290 792,285 792,295" fill="#E99151"/>

    <path d="M 700 440 H 750 V 310 H 800" fill="none" stroke="#005D7B" stroke-width="2"/>
    <polygon points="800,310 792,305 792,315" fill="#005D7B"/>
  </g>

  <g transform="translate(810, 260)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="0" y="0" width="6" height="80" rx="3" fill="#4CA497"/>
    <text x="20" y="25" class="card-title">List 结果合并与重编</text>
    <text x="20" y="45" class="card-desc">CompletableFuture.allOf()</text>
    <text x="20" y="65" class="card-desc">处理索引偏移，避免冲突</text>
  </g>
</svg>
